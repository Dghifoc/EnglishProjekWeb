let score=0,timer=60,gameActive=false,topicIdx=0,currentQ=null,correctFrog=-1;
let timerInterval,frogTimers=[],usedQs=[];

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}

function getQuestion(){
  const topic=TOPICS[topicIdx];
  if(usedQs.length>=topic.questions.length)usedQs=[];
  const available=topic.questions.filter((_,i)=>!usedQs.includes(i));
  const idx=topic.questions.indexOf(available[Math.floor(Math.random()*available.length)]);
  usedQs.push(idx);
  return topic.questions[idx];
}

function startGame(){
  document.getElementById('waf-overlay').style.display='none';
  score=0;timer=60;gameActive=true;usedQs=[];
  document.getElementById('waf-score').textContent=0;
  document.getElementById('waf-timer').textContent=60;
  document.getElementById('waf-timer').style.color='';
  document.getElementById('waf-progress-bar').style.width='100%';
  frogTimers.forEach(clearTimeout);frogTimers=[];
  for(let i=0;i<6;i++){document.getElementById('f'+i).className='frog';}
  nextQuestion();
  timerInterval=setInterval(()=>{
    timer--;
    document.getElementById('waf-timer').textContent=timer;
    document.getElementById('waf-progress-bar').style.width=(timer/60*100)+'%';
    if(timer<=10)document.getElementById('waf-timer').style.color='#e74c3c';
    if(timer<=0)endGame();
  },1000);
}

function nextQuestion(){
  if(!gameActive)return;
  currentQ=getQuestion();
  const topic=TOPICS[topicIdx];
  document.getElementById('waf-qtopic').textContent=topic.name;
  document.getElementById('waf-qtext').textContent=currentQ.q;
  document.getElementById('waf-hint').textContent='';
  document.getElementById('waf-topicbadge').textContent=topic.name;
  const wrongs=shuffle(currentQ.wrongs).slice(0,5);
  const options=shuffle([currentQ.correct,...wrongs]);
  const frogsToShow=shuffle([0,1,2,3,4,5]).slice(0,6);
  correctFrog=frogsToShow[Math.floor(Math.random()*frogsToShow.length)];
  for(let i=0;i<6;i++){document.getElementById('f'+i).className='frog';document.getElementById('fw'+i).textContent='';}
  let optIdx=0;
  const wrongsAvail=options.filter(o=>o!==currentQ.correct);
  frogsToShow.forEach(fi=>{
    const fw=document.getElementById('fw'+fi);
    if(fi===correctFrog)fw.textContent=currentQ.correct;
    else{fw.textContent=wrongsAvail[optIdx++]||wrongs[0];}
    const delay=Math.random()*600+200;
    frogTimers.push(setTimeout(()=>{
      if(!gameActive)return;
      const f=document.getElementById('f'+fi);
      if(f.className==='frog')f.classList.add('up');
    },delay));
  });
  const hideTime=3500+Math.random()*1000;
  frogTimers.push(setTimeout(()=>{
    if(!gameActive)return;
    frogsToShow.forEach(fi=>{
      const f=document.getElementById('f'+fi);
      if(f.className==='frog up'){f.className='frog';}
    });
    setTimeout(()=>{if(gameActive)nextQuestion();},400);
  },hideTime));
}

function whack(idx){
  if(!gameActive)return;
  const f=document.getElementById('f'+idx);
  if(!f.classList.contains('up'))return;
  frogTimers.forEach(clearTimeout);frogTimers=[];
  const isCorrect=(idx===correctFrog);
  if(isCorrect){
    score+=10;document.getElementById('waf-score').textContent=score;
    f.classList.remove('up');f.classList.add('hit','correct');
    showFeedback('✅ +10',true);
    spawnStars(f);
    document.getElementById('waf-hint').textContent='✓ '+currentQ.correct+' = benar!';
  } else {
    score=Math.max(0,score-3);document.getElementById('waf-score').textContent=score;
    f.classList.remove('up');f.classList.add('hit','wrong');
    showFeedback('❌ -3',false);
    document.getElementById('waf-hint').textContent='✗ Salah! Jawaban: '+currentQ.correct;
  }
  setTimeout(()=>{
    f.className='frog';
    for(let i=0;i<6;i++){const fi=document.getElementById('f'+i);if(fi!==f)fi.className='frog';}
    setTimeout(()=>{if(gameActive)nextQuestion();},300);
  },500);
}

function showFeedback(text,good){
  const el=document.getElementById('waf-feedback');
  el.textContent=text;el.style.color=good?'#27ae60':'#e74c3c';
  el.className='show';setTimeout(()=>el.className='',700);
}

function spawnStars(frogEl){
  const stars=['⭐','✨','💫','🌟'];
  for(let i=0;i<3;i++){
    const s=document.createElement('div');s.className='star-sparkle';
    s.textContent=stars[Math.floor(Math.random()*stars.length)];
    const rect=frogEl.getBoundingClientRect();
    s.style.left=(rect.left+Math.random()*60-10)+'px';
    s.style.top=(rect.top+Math.random()*30)+'px';
    document.body.appendChild(s);setTimeout(()=>s.remove(),600);
  }
}

function endGame(){
  gameActive=false;clearInterval(timerInterval);
  frogTimers.forEach(clearTimeout);
  for(let i=0;i<6;i++)document.getElementById('f'+i).className='frog';
  const ov=document.getElementById('waf-overlay');
  ov.style.display='flex';
  const grade=score>=80?'🏆 Luar Biasa!':score>=50?'🥇 Bagus Sekali!':score>=20?'👍 Terus Berlatih!':'💪 Ayo Coba Lagi!';
  ov.innerHTML=`<div class="overlay-box">
    <div style="font-size:48px;margin-bottom:8px">🐸</div>
    <div class="overlay-title">Waktu Habis!</div>
    <div class="overlay-score">${score}</div>
    <div style="font-size:16px;color:#666;margin:8px 0">${grade}</div>
    <div class="overlay-sub">Topik: ${TOPICS[topicIdx].name}</div>
    <button class="btn-big" onclick="startGame()">🔄 Main Lagi</button>
    <button class="btn-big gray" onclick="changeLevel()">📚 Ganti Topik</button>
  </div>`;
}

function changeLevel(){
  gameActive=false;clearInterval(timerInterval);frogTimers.forEach(clearTimeout);
  const ov=document.getElementById('waf-overlay');ov.style.display='flex';
  let html='<div class="overlay-box" style="max-width:340px"><div class="overlay-title" style="margin-bottom:12px">Pilih Topik 📚</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  TOPICS.forEach((t,i)=>{html+=`<button class="btn-big" style="background:${i===topicIdx?'#f0c040':'#f0f0f0'};font-size:12px;padding:10px 8px" onclick="selectTopic(${i})">${t.name}</button>`;});
  html+='</div></div>';ov.innerHTML=html;
}

function selectTopic(idx){topicIdx=idx;usedQs=[];startGame();}

document.addEventListener('mousemove',e=>{
  let h=document.getElementById('waf-hammer');
  if(!h){h=document.createElement('div');h.id='waf-hammer';h.className='hammer-cursor';h.textContent='🔨';document.body.appendChild(h);}
  h.style.left=e.clientX+'px';h.style.top=e.clientY+'px';
});
document.addEventListener('mousedown',()=>{
  const h=document.getElementById('waf-hammer');if(h){h.classList.add('swing');setTimeout(()=>h.classList.remove('swing'),150);}
});
