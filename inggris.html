<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Fun! - Belajar Bahasa Inggris</title>
  <style>
    /* ── Google Fonts embedded as base64 fallback → use system fonts ── */
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --coral:  #FF6B6B;
      --purple: #A855F7;
      --mint:   #4ECDC4;
      --orange: #FF9F43;
      --pink:   #FF6CAB;
      --dark:   #2C3E50;
      --green:  #10B981;
    }

    body {
      font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg,#87CEEB 0%,#B0E0E6 35%,#90EE90 65%,#7ED957 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Clouds ── */
    .clouds { position:fixed;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:0; }
    .cloud {
      position:absolute; background:white; border-radius:50px; opacity:.85;
      animation:floatCloud linear infinite;
    }
    .cloud::before,.cloud::after { content:'';position:absolute;background:white;border-radius:50%; }
    .c1{width:100px;height:35px;top:20px;animation-duration:25s;animation-delay:-10s}
    .c1::before{width:50px;height:50px;top:-25px;left:10px}
    .c1::after{width:35px;height:35px;top:-18px;left:45px}
    .c2{width:130px;height:40px;top:50px;animation-duration:35s;animation-delay:-5s}
    .c2::before{width:60px;height:60px;top:-30px;left:15px}
    .c2::after{width:45px;height:45px;top:-22px;left:60px}
    .c3{width:80px;height:28px;top:15px;animation-duration:20s;animation-delay:-15s}
    .c3::before{width:40px;height:40px;top:-20px;left:8px}
    .c3::after{width:28px;height:28px;top:-14px;left:36px}
    @keyframes floatCloud{from{left:-200px}to{left:110%}}

    /* ── Layout ── */
    .game-wrapper{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:16px 16px 40px}

    /* ── Header ── */
    .header{text-align:center;margin-bottom:16px}
    .game-title{
      font-family:'Fredoka One',cursive;font-size:36px;color:#fff;
      text-shadow:3px 3px 0 #FF6B6B,5px 5px 0 rgba(0,0,0,.15);
      letter-spacing:1px;animation:bounce 2s ease-in-out infinite;
    }
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .subtitle{font-size:14px;color:#fff;font-weight:700;text-shadow:1px 1px 3px rgba(0,0,0,.2)}

    /* ── HUD ── */
    .score-bar{
      display:flex;justify-content:space-between;align-items:center;
      background:rgba(255,255,255,.9);border-radius:50px;padding:8px 20px;
      margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,.1);
    }
    .score-item{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
    .lives{color:var(--coral)} .score-num{color:var(--purple)} .streak{color:var(--orange)}

    /* ── Menu ── */
    .menu-screen{background:rgba(255,255,255,.95);border-radius:28px;padding:28px 20px;
      box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center}
    .menu-mascot{font-size:80px;line-height:1;margin-bottom:12px;display:block;
      animation:wiggle 1.5s ease-in-out infinite}
    @keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    .menu-title{font-family:'Fredoka One',cursive;font-size:26px;color:var(--purple);margin-bottom:6px}
    .menu-desc{font-size:14px;color:#666;margin-bottom:24px;line-height:1.5}
    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .mode-btn{
      background:white;border:3px solid transparent;border-radius:20px;
      padding:16px 12px;cursor:pointer;transition:all .2s;text-align:center;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
    }
    .mode-btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
    .mode-btn.m-vocab{border-color:var(--mint)}
    .mode-btn.m-quiz{border-color:var(--orange)}
    .mode-btn.m-spell{border-color:var(--pink)}
    .mode-btn.m-match{border-color:var(--purple)}
    .mode-emoji{font-size:36px;display:block;margin-bottom:6px}
    .mode-name{font-family:'Fredoka One',cursive;font-size:16px;color:var(--dark)}
    .mode-sub{font-size:11px;color:#999;margin-top:2px}

    /* ── Game card ── */
    .game-screen{display:none}
    .game-card{
      background:rgba(255,255,255,.97);border-radius:28px;padding:24px 20px;
      box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center;margin-bottom:14px;
    }
    .question-label{font-size:12px;font-weight:700;color:#999;text-transform:uppercase;
      letter-spacing:1px;margin-bottom:10px}

    /* Vocab */
    .vocab-img{font-size:88px;line-height:1;margin:8px 0;display:block;
      animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
    /* SVG picture */
    .vocab-svg{width:120px;height:120px;margin:8px auto;display:block;
      animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    .vocab-word{font-family:'Fredoka One',cursive;font-size:40px;color:var(--purple);
      letter-spacing:2px;margin:6px 0}
    .vocab-phonetic{font-size:15px;color:#aaa;margin-bottom:4px}

    /* Options */
    .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .opt-btn{
      background:white;border:3px solid #E0E0E0;border-radius:16px;
      padding:14px 10px;font-family:'Nunito','Segoe UI',sans-serif;
      font-size:14px;font-weight:700;color:var(--dark);cursor:pointer;transition:all .15s;
    }
    .opt-btn:hover{border-color:var(--purple);transform:scale(1.03)}
    .opt-btn.correct{background:#D1FAE5;border-color:var(--green);color:#065F46}
    .opt-btn.wrong{background:#FEE2E2;border-color:var(--coral);color:#991B1B}
    .opt-btn:disabled{cursor:default;transform:none}
    .opt-emoji{font-size:20px;display:block;margin-bottom:4px}
    .opt-svg{width:36px;height:36px;display:block;margin:0 auto 4px}

    /* Spelling */
    .spell-question{font-size:88px;margin:8px 0;display:block}
    .spell-svg{width:110px;height:110px;margin:8px auto;display:block}
    .spell-hint{font-size:14px;color:#888;margin-bottom:12px}
    .letter-display{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
    .letter-box{
      width:40px;height:48px;border-bottom:3px solid var(--purple);
      display:flex;align-items:center;justify-content:center;
      font-family:'Fredoka One',cursive;font-size:26px;color:var(--purple);transition:all .2s;
    }
    .letter-box.filled{background:#F3E8FF;border-radius:8px;border-color:#A855F7}
    .letter-choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
    .letter-btn{
      width:44px;height:44px;border-radius:12px;border:2px solid #E0E0E0;
      background:white;font-family:'Fredoka One',cursive;font-size:22px;
      cursor:pointer;transition:all .15s;color:var(--dark);
    }
    .letter-btn:hover{border-color:var(--purple);background:#F3E8FF;transform:scale(1.1)}
    .letter-btn:disabled{opacity:.3;cursor:default;transform:none}
    .clear-btn{
      margin-top:12px;background:none;border:2px solid #E0E0E0;border-radius:50px;
      padding:8px 20px;font-family:'Nunito',sans-serif;font-weight:700;
      font-size:14px;cursor:pointer;color:#888;
    }
    .clear-btn:hover{border-color:var(--coral);color:var(--coral)}

    /* Matching */
    .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .match-col{display:flex;flex-direction:column;gap:8px}
    .match-item{
      background:white;border:3px solid #E0E0E0;border-radius:14px;
      padding:10px 8px;cursor:pointer;transition:all .15s;font-weight:700;text-align:center;
    }
    .match-item:hover{border-color:var(--mint);transform:scale(1.03)}
    .match-item.selected{border-color:var(--orange);background:#FFF3E0}
    .match-item.matched{border-color:var(--green);background:#D1FAE5;color:#065F46;cursor:default}
    .match-item.wrong-match{border-color:var(--coral);background:#FEE2E2;animation:shake .3s}
    .match-emoji{font-size:26px;display:block}
    .match-svg{width:44px;height:44px;display:block;margin:0 auto 2px}
    .match-word{font-size:13px;color:var(--dark)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    /* Progress */
    .progress-bar{height:10px;background:rgba(255,255,255,.4);border-radius:50px;
      margin-bottom:14px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,#FFD93D,#FF6B6B);
      border-radius:50px;transition:width .5s ease}

    /* Next btn */
    .next-btn{
      width:100%;background:linear-gradient(135deg,#A855F7,#EC4899);color:white;
      border:none;border-radius:50px;padding:16px;
      font-family:'Fredoka One',cursive;font-size:20px;cursor:pointer;
      box-shadow:0 6px 20px rgba(168,85,247,.4);transition:transform .1s;letter-spacing:.5px;
    }
    .next-btn:hover{transform:translateY(-2px)}
    .next-btn:active{transform:scale(.97)}

    /* Feedback */
    .feedback-overlay{
      position:fixed;top:0;left:0;right:0;bottom:0;
      display:flex;align-items:center;justify-content:center;
      z-index:100;pointer-events:none;opacity:0;transition:opacity .3s;
    }
    .feedback-overlay.show{opacity:1}
    .feedback-box{
      background:white;border-radius:24px;padding:24px 36px;text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
      transform:scale(.8);transition:transform .3s cubic-bezier(.175,.885,.32,1.275);
    }
    .feedback-overlay.show .feedback-box{transform:scale(1)}
    .feedback-emoji{font-size:60px;display:block}
    .feedback-text{font-family:'Fredoka One',cursive;font-size:26px;margin-top:8px}
    .feedback-text.good{color:var(--green)} .feedback-text.bad{color:var(--coral)}

    /* Confetti */
    .confetti-piece{position:fixed;border-radius:2px;pointer-events:none;z-index:200;
      animation:confettiFall linear forwards}
    @keyframes confettiFall{
      0%{transform:translateY(-20px) rotate(0deg);opacity:1}
      100%{transform:translateY(100vh) rotate(720deg);opacity:0}
    }

    /* Result */
    .result-screen{display:none;background:rgba(255,255,255,.97);border-radius:28px;
      padding:32px 24px;box-shadow:0 8px 32px rgba(0,0,0,.15);text-align:center}
    .result-mascot{font-size:80px;display:block;margin-bottom:10px}
    .result-title{font-family:'Fredoka One',cursive;font-size:30px;color:var(--purple);margin-bottom:6px}
    .result-score{font-family:'Fredoka One',cursive;font-size:48px;color:var(--orange);margin:10px 0}
    .result-stars{font-size:36px;margin-bottom:16px;display:block}
    .result-msg{font-size:16px;color:#666;margin-bottom:24px}
    .result-btns{display:flex;gap:10px}
    .replay-btn{
      flex:1;background:white;border:3px solid var(--purple);border-radius:50px;padding:14px;
      font-family:'Fredoka One',cursive;font-size:18px;color:var(--purple);cursor:pointer;transition:all .15s;
    }
    .replay-btn:hover{background:var(--purple);color:white}
    .menu-return-btn{
      flex:1;background:linear-gradient(135deg,#A855F7,#EC4899);border:none;
      border-radius:50px;padding:14px;font-family:'Fredoka One',cursive;
      font-size:18px;color:white;cursor:pointer;transition:transform .1s;
    }
    .menu-return-btn:hover{transform:scale(1.02)}
    .hidden{display:none!important}

    @media(max-width:480px){
      .game-title{font-size:26px} .vocab-word{font-size:30px}
      .vocab-svg{width:90px;height:90px}
    }
  </style>
</head>
<body>

<!-- ═══ CLOUDS ═══ -->
<div class="clouds">
  <div class="cloud c1" style="left:-200px"></div>
  <div class="cloud c2" style="left:-300px"></div>
  <div class="cloud c3" style="left:-150px"></div>
</div>

<div class="game-wrapper">

  <!-- Header -->
  <div class="header">
    <div class="game-title">🌟 English Fun! 🌟</div>
    <div class="subtitle">Belajar Bahasa Inggris Seru!</div>
  </div>

  <!-- HUD -->
  <div class="score-bar">
    <div class="score-item lives"     id="livesDisplay">❤️❤️❤️</div>
    <div class="score-item score-num" id="scoreDisplay">⭐ 0</div>
    <div class="score-item streak"    id="streakDisplay">🔥 0x</div>
  </div>

  <!-- ═══ MENU ═══ -->
  <div class="menu-screen" id="menuScreen">
    <span class="menu-mascot">🦉</span>
    <div class="menu-title">Halo, Pelajar Hebat!</div>
    <div class="menu-desc">Pilih mode permainan favoritmu<br>dan mulai petualangan bahasa Inggris!</div>
    <div class="mode-grid">
      <button class="mode-btn m-vocab"  onclick="startMode('vocab')">
        <span class="mode-emoji">📚</span>
        <div class="mode-name">Vocab Quiz</div>
        <div class="mode-sub">Tebak artinya!</div>
      </button>
      <button class="mode-btn m-quiz"   onclick="startMode('picture')">
        <span class="mode-emoji">🖼️</span>
        <div class="mode-name">Picture Quiz</div>
        <div class="mode-sub">Lihat dan pilih!</div>
      </button>
      <button class="mode-btn m-spell"  onclick="startMode('spell')">
        <span class="mode-emoji">🔤</span>
        <div class="mode-name">Spelling</div>
        <div class="mode-sub">Susun hurufnya!</div>
      </button>
      <button class="mode-btn m-match"  onclick="startMode('match')">
        <span class="mode-emoji">🎯</span>
        <div class="mode-name">Matching</div>
        <div class="mode-sub">Cocokkan pasangan!</div>
      </button>
    </div>
  </div>

  <!-- ═══ GAME ═══ -->
  <div class="game-screen" id="gameScreen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="game-card" id="gameCard"></div>
    <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Lanjut! →</button>
  </div>

  <!-- ═══ RESULT ═══ -->
  <div class="result-screen" id="resultScreen">
    <span class="result-mascot" id="resultMascot">🏆</span>
    <div class="result-title"   id="resultTitle">Luar Biasa!</div>
    <div class="result-score"   id="resultScore">0</div>
    <span class="result-stars"  id="resultStars">⭐⭐⭐</span>
    <div class="result-msg"     id="resultMsg"></div>
    <div class="result-btns">
      <button class="replay-btn"      onclick="replayMode()">🔄 Main Lagi</button>
      <button class="menu-return-btn" onclick="goMenu()">🏠 Menu</button>
    </div>
  </div>
</div>

<!-- Feedback popup -->
<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-box">
    <span class="feedback-emoji" id="feedbackEmoji">🎉</span>
    <div class="feedback-text"   id="feedbackText">Benar!</div>
  </div>
</div>

/* helper – returns the SVG HTML string */
function img(word, size=80) {
  return SVG[word] ? SVG[word](size) : `<span style="font-size:${size*0.9}px;line-height:1">${EMOJI[word]||'❓'}</span>`;
}

/* fallback emoji map */
const EMOJI = {
  Apple:'🍎',Banana:'🍌',Cat:'🐱',Dog:'🐶',Elephant:'🐘',Fish:'🐟',
  Flower:'🌸',Sun:'☀️',Moon:'🌙',Star:'⭐',Book:'📚',Pencil:'✏️',
  Car:'🚗',Airplane:'✈️',House:'🏠',Tree:'🌳',Bird:'🐦',Lion:'🦁',
  Rabbit:'🐰',Water:'💧'
};

/* ── Vocab Data ── */
const VOCAB_DATA = [
  { word:'Apple',    meaning:'Apel',     phonetic:'/ˈæp.əl/',     category:'Buah' },
  { word:'Banana',   meaning:'Pisang',   phonetic:'/bəˈnɑː.nə/',  category:'Buah' },
  { word:'Cat',      meaning:'Kucing',   phonetic:'/kæt/',         category:'Hewan' },
  { word:'Dog',      meaning:'Anjing',   phonetic:'/dɒɡ/',         category:'Hewan' },
  { word:'Elephant', meaning:'Gajah',    phonetic:'/ˈel.ɪ.fənt/', category:'Hewan' },
  { word:'Fish',     meaning:'Ikan',     phonetic:'/fɪʃ/',         category:'Hewan' },
  { word:'Flower',   meaning:'Bunga',    phonetic:'/ˈflaʊ.ər/',   category:'Alam' },
  { word:'Sun',      meaning:'Matahari', phonetic:'/sʌn/',         category:'Alam' },
  { word:'Moon',     meaning:'Bulan',    phonetic:'/muːn/',        category:'Alam' },
  { word:'Star',     meaning:'Bintang',  phonetic:'/stɑːr/',       category:'Alam' },
  { word:'Book',     meaning:'Buku',     phonetic:'/bʊk/',         category:'Benda' },
  { word:'Pencil',   meaning:'Pensil',   phonetic:'/ˈpen.səl/',    category:'Benda' },
  { word:'Car',      meaning:'Mobil',    phonetic:'/kɑːr/',        category:'Transportasi' },
  { word:'Airplane', meaning:'Pesawat',  phonetic:'/ˈeər.pleɪn/', category:'Transportasi' },
  { word:'House',    meaning:'Rumah',    phonetic:'/haʊs/',        category:'Tempat' },
  { word:'Tree',     meaning:'Pohon',    phonetic:'/triː/',        category:'Alam' },
  { word:'Bird',     meaning:'Burung',   phonetic:'/bɜːrd/',       category:'Hewan' },
  { word:'Lion',     meaning:'Singa',    phonetic:'/ˈlaɪ.ən/',    category:'Hewan' },
  { word:'Rabbit',   meaning:'Kelinci',  phonetic:'/ˈræb.ɪt/',    category:'Hewan' },
  { word:'Water',    meaning:'Air',      phonetic:'/ˈwɔː.tər/',   category:'Alam' },
];

/* ── State ── */
let currentMode='', currentQ=0, totalQ=8, score=0, lives=3, streak=0;
let questionData=[], answered=false;

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function pick(a,n){return shuffle(a).slice(0,n)}

function updateHUD(){
  document.getElementById('livesDisplay').textContent='❤️'.repeat(lives)+( lives<3?'🖤'.repeat(3-lives):'' );
  document.getElementById('scoreDisplay').textContent=`⭐ ${score}`;
  document.getElementById('streakDisplay').textContent=`🔥 ${streak}x`;
}

/* ── Start ── */
function startMode(mode){
  currentMode=mode; currentQ=0; score=0; lives=3; streak=0; updateHUD();
  questionData=pick(VOCAB_DATA,totalQ);
  document.getElementById('menuScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  document.getElementById('nextBtn').classList.add('hidden');
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('progressFill').style.width=(currentQ/totalQ*100)+'%';
  const item=questionData[currentQ], card=document.getElementById('gameCard');
  if(currentMode==='vocab')   renderVocab(item,card);
  else if(currentMode==='picture') renderPicture(item,card);
  else if(currentMode==='spell')   renderSpell(item,card);
  else if(currentMode==='match')   renderMatch(card);
}

function getWrongs(item,n){return shuffle(VOCAB_DATA.filter(v=>v.word!==item.word)).slice(0,n)}

/* ── MODE 1: VOCAB ── */
function renderVocab(item,card){
  const opts=shuffle([item,...getWrongs(item,3)]);
  card.innerHTML=`
    <div class="question-label">Apa arti kata ini? 🤔</div>
    <div class="vocab-svg">${img(item.word,100)}</div>
    <div class="vocab-word">${item.word}</div>
    <div class="vocab-phonetic">${item.phonetic}</div>
    <div class="options-grid">
      ${opts.map(o=>`<button class="opt-btn" onclick="checkVocabAns(this,'${o.meaning}','${item.meaning}')">${o.meaning}</button>`).join('')}
    </div>`;
}
function checkVocabAns(btn,chosen,correct){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(chosen===correct){btn.classList.add('correct');onCorrect();}
  else{
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('correct');});
    onWrong();
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}

/* ── MODE 2: PICTURE ── */
function renderPicture(item,card){
  const opts=shuffle([item,...getWrongs(item,3)]);
  card.innerHTML=`
    <div class="question-label">Pilih gambar yang benar! 🖼️</div>
    <div style="font-family:'Fredoka One',cursive;font-size:34px;color:#A855F7;margin:12px 0">${item.word}</div>
    <div style="color:#999;font-size:13px;margin-bottom:12px">${item.phonetic}</div>
    <div class="options-grid">
      ${opts.map(o=>`<button class="opt-btn" onclick="checkPicAns(this,'${o.word}','${item.word}')">
        <span class="opt-svg">${img(o.word,36)}</span>${o.meaning}
      </button>`).join('')}
    </div>`;
}
function checkPicAns(btn,chosen,correct){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(chosen===correct){btn.classList.add('correct');onCorrect();}
  else{
    btn.classList.add('wrong');
    document.querySelectorAll('.opt-btn').forEach(b=>{
      if((b.getAttribute('onclick')||'').includes(`'${correct}'`))b.classList.add('correct');
    });
    onWrong();
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}

/* ── MODE 3: SPELLING ── */
let spellWord='', spellAnswer=[], spellLetters=[];
function renderSpell(item,card){
  spellWord=item.word.toUpperCase(); spellAnswer=[];
  const extras='AEIOURSTLN'.split('').filter(c=>!spellWord.includes(c));
  spellLetters=shuffle([...spellWord.split(''),...pick(extras,Math.min(4,extras.length))]);
  card.innerHTML=`
    <div class="question-label">Susun hurufnya! 🔤</div>
    <div class="spell-svg">${img(item.word,90)}</div>
    <div class="spell-hint">Artinya: <strong>${item.meaning}</strong></div>
    <div class="letter-display" id="letterDisplay">
      ${spellWord.split('').map((_,i)=>`<div class="letter-box" id="lb${i}"></div>`).join('')}
    </div>
    <div class="letter-choices">
      ${spellLetters.map((l,i)=>`<button class="letter-btn" id="lbtn${i}" onclick="pickLetter(${i},'${l}')">${l}</button>`).join('')}
    </div>
    <button class="clear-btn" onclick="clearSpell()">✕ Hapus</button>`;
}
function pickLetter(idx,letter){
  if(answered)return;
  const btn=document.getElementById('lbtn'+idx); if(btn.disabled)return;
  btn.disabled=true; spellAnswer.push({idx,letter});
  const lb=document.getElementById('lb'+(spellAnswer.length-1));
  lb.textContent=letter; lb.classList.add('filled');
  if(spellAnswer.length===spellWord.length){
    answered=true;
    const formed=spellAnswer.map(a=>a.letter).join('');
    const ok=formed===spellWord;
    document.querySelectorAll('.letter-box').forEach(b=>{
      b.style.background=ok?'#D1FAE5':'#FEE2E2';
      b.style.borderColor=ok?'#10B981':'#EF4444';
      b.style.color=ok?'#065F46':'#991B1B';
    });
    ok?onCorrect():onWrong();
    document.getElementById('nextBtn').classList.remove('hidden');
  }
}
function clearSpell(){
  if(answered)return;
  spellAnswer.forEach(a=>{ document.getElementById('lbtn'+a.idx).disabled=false; });
  spellAnswer=[];
  for(let i=0;i<spellWord.length;i++){
    const lb=document.getElementById('lb'+i);
    lb.textContent=''; lb.classList.remove('filled');
    lb.style.background=lb.style.borderColor=lb.style.color='';
  }
}

/* ── MODE 4: MATCHING ── */
let matchData=[],matchSelected=null,matchPairs={},matchDone=0;
function renderMatch(card){
  const pool=pick(VOCAB_DATA,4); matchData=pool; matchSelected=null; matchPairs={}; matchDone=0;
  const lefts=shuffle(pool), rights=shuffle(pool);
  card.innerHTML=`
    <div class="question-label">Cocokkan kata dengan gambarnya! 🎯</div>
    <div class="match-grid" style="margin-top:14px">
      <div class="match-col">
        ${lefts.map(it=>`<div class="match-item" id="ml_${it.word}" onclick="selectMatch('word','${it.word}')">
          <span class="match-word" style="font-size:16px;font-weight:800">${it.word}</span>
        </div>`).join('')}
      </div>
      <div class="match-col">
        ${rights.map(it=>`<div class="match-item" id="mr_${it.word}" onclick="selectMatch('emoji','${it.word}')">
          <span class="match-svg">${img(it.word,44)}</span>
          <span class="match-word">${it.meaning}</span>
        </div>`).join('')}
      </div>
    </div>`;
}
function selectMatch(side,word){
  if(matchPairs[word])return;
  if(matchSelected&&matchSelected.side===side)return;
  if(!matchSelected){
    matchSelected={side,word};
    document.getElementById((side==='word'?'ml_':'mr_')+word).classList.add('selected');
  } else {
    const wk=side==='word'?word:matchSelected.word;
    const ek=side==='emoji'?word:matchSelected.word;
    const pId=(matchSelected.side==='word'?'ml_':'mr_')+matchSelected.word;
    const cId=(side==='word'?'ml_':'mr_')+word;
    document.getElementById(pId).classList.remove('selected');
    if(wk===ek){
      document.getElementById('ml_'+wk).classList.add('matched');
      document.getElementById('mr_'+wk).classList.add('matched');
      matchPairs[wk]=true; matchDone++;
      if(matchDone===matchData.length){
        answered=true; onCorrect();
        document.getElementById('nextBtn').classList.remove('hidden');
      }
    } else {
      [pId,cId].forEach(id=>{
        document.getElementById(id).classList.add('wrong-match');
        setTimeout(()=>document.getElementById(id).classList.remove('wrong-match'),400);
      });
      lives=Math.max(0,lives-1); streak=0; updateHUD();
    }
    matchSelected=null;
  }
}

/* ── Feedback ── */
function onCorrect(){
  score+=streak>=3?2:1; streak++; updateHUD(); showFeedback(true); spawnConfetti();
}
function onWrong(){
  lives=Math.max(0,lives-1); streak=0; updateHUD(); showFeedback(false);
}
function showFeedback(ok){
  const overlay=document.getElementById('feedbackOverlay');
  const emojis=ok?['🎉','⭐','🌟','🥳','👏','🎊','💫','🏆']:['😅','🙈','💪','😮','🤔'];
  const texts=ok?['Benar!','Hebat!','Keren!','Yes!','Mantap!']:['Salah!','Coba Lagi!','Hampir!','Semangat!'];
  document.getElementById('feedbackEmoji').textContent=emojis[Math.floor(Math.random()*emojis.length)];
  const ft=document.getElementById('feedbackText');
  ft.textContent=texts[Math.floor(Math.random()*texts.length)];
  ft.className='feedback-text '+(ok?'good':'bad');
  overlay.classList.add('show');
  setTimeout(()=>overlay.classList.remove('show'),900);
}
function spawnConfetti(){
  const colors=['#FF6B6B','#FFD93D','#6EC6F5','#A855F7','#7ED957','#FF9F43','#FF6CAB','#4ECDC4'];
  for(let i=0;i<18;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${.8+Math.random()*.8}s;animation-delay:${Math.random()*.3}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  }
}

/* ── Navigation ── */
function nextQuestion(){
  currentQ++;
  if(currentQ>=totalQ||lives<=0) showResult();
  else renderQuestion();
}
function showResult(){
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  const pct=score/(totalQ*2)*100;
  let mascot,title,stars,msg;
  if(pct>=80){mascot='🏆';title='Luar Biasa!';stars='⭐⭐⭐';msg=`Kamu mendapat ${score} bintang! Kamu jagoan bahasa Inggris!`;}
  else if(pct>=50){mascot='🌟';title='Bagus Sekali!';stars='⭐⭐';msg=`${score} bintang! Terus berlatih ya, kamu pasti bisa!`;}
  else{mascot='💪';title='Ayo Semangat!';stars='⭐';msg='Jangan menyerah! Coba lagi dan kamu pasti lebih baik!';}
  document.getElementById('resultMascot').textContent=mascot;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultScore').textContent=`${score} ⭐`;
  document.getElementById('resultStars').textContent=stars;
  document.getElementById('resultMsg').textContent=msg;
  for(let i=0;i<30;i++) setTimeout(spawnConfetti,i*60);
}
function replayMode(){startMode(currentMode);}
function goMenu(){
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('menuScreen').style.display='block';
  currentQ=0;score=0;lives=3;streak=0;updateHUD();
}

updateHUD();
</script>
</body>
</html>
