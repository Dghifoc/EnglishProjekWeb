<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Word Puzzle - Advanced</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --secondary: #e67e22;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --bg: #f5f7fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
            transition: all 0.3s ease;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Difficulty Selection Setup */
        .difficulty-section {
            margin-bottom: 20px;
        }

        .difficulty-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 5px 0;
            margin-bottom: 15px;
        }

        .btn-diff {
            display: table-cell;
            background-color: var(--light);
            color: var(--dark);
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-diff:hover {
            background-color: #e2e6e9;
        }

        .btn-diff.active[data-level="easy"] {
            background-color: var(--success);
            color: white;
        }

        .btn-diff.active[data-level="medium"] {
            background-color: var(--secondary);
            color: white;
        }

        .btn-diff.active[data-level="hard"] {
            background-color: var(--danger);
            color: white;
        }

        /* Dashboard Status (Timer & Score) */
        .status-bar {
            display: table;
            width: 100%;
            margin: 20px 0;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #eef2f5;
        }

        .status-item {
            display: table-cell;
            width: 50%;
            text-align: center;
        }

        .status-item:first-child {
            border-right: 1px solid #e2e8f0;
        }

        .status-label {
            font-size: 0.8rem;
            color: #7f8c8d;
            text-transform: uppercase;
            display: block;
            margin-bottom: 2px;
        }

        .status-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        #timer.warning {
            color: var(--danger);
            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }

        /* Puzzle Presentation */
        .scrambled-word {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: var(--dark);
            margin: 25px 0 15px 0;
            text-transform: uppercase;
            word-wrap: break-word;
        }

        .hint {
            font-size: 0.95rem;
            color: #555;
            background-color: #f1f9ff;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            margin-bottom: 25px;
            text-align: left;
            min-height: 40px;
        }

        /* Interactive Inputs */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.3rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        input[type="text"]:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
        }

        .action-buttons {
            display: block;
        }

        button.btn-action {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 12px;
            transition: all 0.2s ease;
            color: white;
        }

        .btn-check {
            background-color: var(--primary);
        }

        .btn-check:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-check:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .btn-skip {
            background-color: transparent;
            color: #7f8c8d;
            border: 2px solid #cbd5e1;
            font-size: 0.95rem;
            padding: 10px;
        }

        .btn-skip:hover:not(:disabled) {
            background-color: #f8f9fa;
            color: var(--dark);
        }

        /* Feedback Section */
        .message {
            margin: 15px 0;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 26px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Word Puzzle</h1>
    <p class="subtitle">Asah kemampuan Bahasa Inggris sesuai levelmu!</p>
    
    <!-- Difficulty Chooser -->
    <div class="difficulty-section">
        <span class="difficulty-label">Pilih Tingkat Kesulitan:</span>
        <div class="btn-group">
            <button class="btn-diff active" data-level="easy" onclick="changeDifficulty('easy')">Easy</button>
            <button class="btn-diff" data-level="medium" onclick="changeDifficulty('medium')">Medium</button>
            <button class="btn-diff" data-level="hard" onclick="changeDifficulty('hard')">Hard</button>
        </div>
    </div>

    <!-- Live Dashboard -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">Sisa Waktu</span>
            <span class="status-value" id="timer">20s</span>
        </div>
        <div class="status-item">
            <span class="status-label">Total Skor</span>
            <span class="status-value" id="score">0</span>
        </div>
    </div>
    
    <!-- Puzzle Board -->
    <div class="scrambled-word" id="scrambledWord">-----</div>
    <div class="hint" id="hintText">Hint: Loading...</div>

    <!-- User Field -->
    <input type="text" id="userInput" placeholder="Ketik jawaban di sini" autocomplete="off">
    
    <!-- Control Triggers -->
    <div class="action-buttons">
        <button class="btn-action btn-check" id="btnCheck" onclick="checkWord()">CEK JAWABAN</button>
        <button class="btn-action btn-skip" id="btnSkip" onclick="skipWord()">Lewati Kata</button>
    </div>

    <div class="message" id="message"></div>
</div>

<script>
    // Database Kata berdasarkan Tingkat Kesulitan
    const wordDatabase = {
        easy: [
            { word: "CAT", hint: "A small domesticated carnivorous mammal known for meowing" },
            { word: "DOG", hint: "A common animal kept as a pet or for guarding buildings" },
            { word: "FISH", hint: "An animal that lives and breathes only in water" },
            { word: "BOOK", hint: "You read this to gain knowledge or enjoy a story" },
            { word: "MILK", hint: "A white liquid produced by cows that is good for bones" },
            { word: "TREE", hint: "A tall perennial plant with a wooden trunk and leaves" },
            { word: "BIRD", hint: "An animal with feathers and wings that can usually fly" },
            { word: "HOME", hint: "The place where you live permanently with your family" }
        ],
        medium: [
            { word: "APPLE", hint: "A round fruit with red, green, or yellow skin and crisp white flesh" },
            { word: "GUITAR", hint: "A stringed musical instrument played with fingers or a pick" },
            { word: "OCEAN", hint: "A very large expanse of sea, in particular, each of the main areas of salt water" },
            { word: "GARDEN", hint: "A piece of ground next to a house used for growing flowers or vegetables" },
            { word: "SCHOOL", hint: "An institution for educating children or students" },
            { word: "KITCHEN", hint: "A room or area where food is prepared and cooked" },
            { word: "BICYCLE", hint: "A vehicle consisting of two wheels held in a frame one behind the other" },
            { word: "WINDOW", hint: "An opening in a wall or door to admit light or air" }
        ],
        hard: [
            { word: "COMPUTER", hint: "An electronic device for storing and processing data according to instructions" },
            { word: "MOUNTAIN", hint: "A large natural elevation of the earth's surface rising abruptly from the surrounding level" },
            { word: "ALGORITHM", hint: "A process or set of rules to be followed in calculations or problem-solving" },
            { word: "ARCHITECTURE", hint: "The art or practice of designing and constructing buildings" },
            { word: "VOCABULARY", hint: "The body of words used in a particular language or known to an individual" },
            { word: "ENVIRONMENT", hint: "The surroundings or conditions in which a person, animal, or plant lives" },
            { word: "CHALLENGE", hint: "A task or situation that tests someone's abilities" },
            { word: "MYSTERIOUS", hint: "Difficult or impossible to understand, explain, or identify" }
        ]
    };

    // Alokasi durasi waktu per kata berdasarkan tingkat kesulitan (detik)
    const timerSettings = {
        easy: 30,
        medium: 20,
        hard: 15
    };

    let currentDifficulty = "easy";
    let currentWord = "";
    let score = 0;
    let timeLeft = 0;
    let timerInterval = null;
    let isGameOver = false;

    // Inisialisasi awal permainan
    function initGame() {
        if (timerInterval) clearInterval(timerInterval);
        
        // Reset Element Interaktif
        document.getElementById("message").innerText = "";
        const userInput = document.getElementById("userInput");
        userInput.value = "";
        userInput.removeAttribute("disabled");
        document.getElementById("btnCheck").removeAttribute("disabled");
        document.getElementById("btnSkip").removeAttribute("disabled");
        isGameOver = false;

        // Pilih koleksi kata berdasarkan tingkat kesulitan aktif
        const activeWords = wordDatabase[currentDifficulty];
        const randomObj = activeWords[Math.floor(Math.random() * activeWords.length)];
        currentWord = randomObj.word;
        
        // Acak susunan huruf kata tersebut
        let scrambled = shuffleWord(currentWord);
        
        // Pastikan kata teracak tidak sama persis dengan aslinya
        while (scrambled === currentWord && currentWord.length > 1) {
            scrambled = shuffleWord(currentWord);
        }

        // Tampilkan ke antarmuka pengguna
        document.getElementById("scrambledWord").innerText = scrambled;
        document.getElementById("hintText").innerText = "Hint: " + randomObj.hint;

        // Setup Timer
        timeLeft = timerSettings[currentDifficulty];
        updateTimerDisplay();
        
        // Mulai Hitung Mundur
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 5) {
                document.getElementById("timer").classList.add("warning");
            } else {
                document.getElementById("timer").classList.remove("warning");
            }

            if (timeLeft <= 0) {
                handleTimeOut();
            }
        }, 1000);
    }

    // Fungsi utilitas mengacak huruf
    function shuffleWord(word) {
        return word.split('').sort(() => Math.random() - 0.5).join('');
    }

    // Perbarui display timer di UI
    function updateTimerDisplay() {
        document.getElementById("timer").innerText = timeLeft + "s";
    }

    // Fungsi mengubah tingkat kesulitan game
    function changeDifficulty(level) {
        if (currentDifficulty === level && !isGameOver) return;
        
        currentDifficulty = level;
        
        // Perbarui class active pada tombol navigasi kesulitan
        document.querySelectorAll(".btn-diff").forEach(btn => {
            if (btn.getAttribute("data-level") === level) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });

        // Restart game dengan kesulitan baru
        initGame();
    }

    // Validasi Jawaban Pengguna
    function checkWord() {
        if (isGameOver) return;

        let userVal = document.getElementById("userInput").value.toUpperCase().trim();
        let msgElement = document.getElementById("message");

        if (!userVal) {
            msgElement.style.color = "var(--secondary)";
            msgElement.innerText = "⚠️ Ketik jawabanmu terlebih dahulu!";
            return;
        }

        if (userVal === currentWord) {
            clearInterval(timerInterval);
            msgElement.style.color = "var(--success)";
            msgElement.innerText = "🎉 Correct! Excellent job!";
            
            // Perolehan skor bervariasi tergantung bobot tingkat kesulitan
            let point = 10;
            if (currentDifficulty === "medium") point = 15;
            if (currentDifficulty === "hard") point = 25;
            
            score += point;
            document.getElementById("score").innerText = score;
            
            disableInputs();
            setTimeout(initGame, 1500);
        } else {
            msgElement.style.color = "var(--danger)";
            msgElement.innerText = "❌ Wrong answer! Try again.";
        }
    }

    // Melewati Kata Aktif (Skip)
    function skipWord() {
        clearInterval(timerInterval);
        let msgElement = document.getElementById("message");
        msgElement.style.color = "var(--secondary)";
        msgElement.innerText = `Skiped! Jawaban asli: ${currentWord}`;
        
        disableInputs();
        setTimeout(initGame, 1800);
    }

    // Penanganan kondisi jika waktu habis
    function handleTimeOut() {
        clearInterval(timerInterval);
        isGameOver = true;
        
        let msgElement = document.getElementById("message");
        msgElement.style.color = "var(--danger)";
        msgElement.innerText = `⏰ Waktu Habis! Jawabannya: ${currentWord}`;
        
        disableInputs();
        
        // Otomatis pindah ke kata berikutnya setelah 2.5 detik
        setTimeout(initGame, 2500);
    }

    // Menonaktifkan kontrol interaksi saat transisi soal
    function disableInputs() {
        document.getElementById("userInput").setAttribute("disabled", "true");
        document.getElementById("btnCheck").setAttribute("disabled", "true");
        document.getElementById("btnSkip").setAttribute("disabled", "true");
    }

    // Memasang Event Listener Enter Key pada kolom teks input
    document.getElementById("userInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            checkWord();
        }
    });

    // Jalankan game secara otomatis saat file dibuka
    window.onload = initGame;
</script>

</body>
</html>
